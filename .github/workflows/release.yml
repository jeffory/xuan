name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check tag against Cargo version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?', version):
              raise SystemExit('Release versions must be semver without build metadata')
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag!r} does not match Cargo.toml version v{version}')
          PY
  build-linux:
    needs: validate
    uses: ./.github/workflows/linux.yml
  build-windows:
    needs: validate
    uses: ./.github/workflows/windows.yml
  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: xuan-*-x86_64
          merge-multiple: true
          path: dist
      - name: Verify release checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          version="${RELEASE_TAG#v}"
          for artifact in "xuan-$version-linux-x86_64.tar.gz" \
                          "xuan-$version-linux-x86_64.deb" \
                          "xuan-$version-linux-x86_64.rpm" \
                          "xuan-$version-x86_64.AppImage" \
                          "xuan-$version-windows-x86_64.zip" \
                          "xuan-$version-source.tar.gz"; do
            test -f "$artifact"
            sha256sum --check "$artifact.sha256"
          done
      - name: Publish release notes and packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          # Notes are generated server-side by GitHub; no third-party code runs
          # with the write token. Re-runs reuse the existing release.
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            prerelease=()
            [[ $version == *-* ]] && prerelease=(--prerelease)
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
              --title "$RELEASE_TAG" "${prerelease[@]}" --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$RELEASE_TAG" \
            dist/xuan-"$version"-linux-x86_64.{tar.gz,deb,rpm}{,.sha256} \
            dist/xuan-"$version"-x86_64.AppImage{,.sha256} \
            dist/xuan-"$version"-windows-x86_64.zip{,.sha256} \
            dist/xuan-"$version"-source.tar.gz{,.sha256} \
            --clobber --repo "$GITHUB_REPOSITORY"
