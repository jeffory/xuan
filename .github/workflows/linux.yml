name: Linux
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# Literal prefix: inside a reusable-workflow call github.workflow is the
# caller's name, which would put Linux and Windows in one group.
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # Keep native release binaries usable on glibc 2.35 and newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      # Shown in About and `xuan --version`; build.rs shortens the commit to 7 characters.
      XUAN_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      # Only the tag-triggered Release workflow (which calls this one) builds a release.
      XUAN_BUILD_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'dev' }}
      XUAN_MAX_GLIBC: '2.35'
      # Missing real-camera fixtures fail the RAW tests instead of skipping.
      XUAN_REQUIRE_RAW_FIXTURES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libvulkan1 mesa-vulkan-drivers desktop-file-utils xvfb dpkg rpm cpio binutils squashfs-tools
      - name: Set up AppImage packaging
        run: |
          mkdir -p "$RUNNER_TEMP/appimage-tools"
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimage-tools/linuxdeploy"
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $RUNNER_TEMP/appimage-tools/linuxdeploy" | sha256sum --check
          chmod +x "$RUNNER_TEMP/appimage-tools/linuxdeploy"
          curl --fail --location --retry 3 \
            https://github.com/NixOS/patchelf/releases/download/0.19.1/patchelf-0.19.1-x86_64.tar.gz \
            --output "$RUNNER_TEMP/patchelf.tar.gz"
          echo "a6818fef80128fb354423234ecacdcca3e993913d774e5d8346bc63f70fed4cf  $RUNNER_TEMP/patchelf.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/patchelf.tar.gz" -C "$RUNNER_TEMP/appimage-tools" ./bin/patchelf
          echo "$RUNNER_TEMP/appimage-tools" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/appimage-tools/bin" >> "$GITHUB_PATH"
      - name: Set up Rust
        # Installs the toolchain pinned in rust-toolchain.toml, and the musl
        # target the packaged MCP server plugin is linked statically with.
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - name: Cache RAW test fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testdata/raw/cache
          key: raw-fixtures-${{ hashFiles('testdata/raw/fixtures.txt') }}
      - name: Fetch RAW test fixtures
        run: scripts/fetch-raw-fixtures.sh
      - name: Check and test
        run: scripts/check.sh --gpu
      - name: Upload golden-image differences
        # Written by the golden tests (src/goldens.rs) when a rendering differs.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-failures-linux
          path: target/golden-failures/
          if-no-files-found: ignore
      - name: Validate desktop integration
        run: desktop-file-validate packaging/me.silverl.xuan.desktop
      - name: Package
        run: scripts/package.sh all
      - name: Verify distribution packages
        run: python3 scripts/check-packages.py
      - name: AppImage X11 smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/appimage smoke"
          cd "$RUNNER_TEMP/appimage smoke"
          xvfb-run -a env -u WAYLAND_DISPLAY APPIMAGE_EXTRACT_AND_RUN=1 \
            "$GITHUB_WORKSPACE"/dist/*.AppImage --demo --screenshot "xuan demo.png"
          test -s "xuan demo.png"
      - name: Install Debian package
        run: sudo apt-get install -y ./dist/*.deb
      - name: Native X11 smoke test
        run: xvfb-run -a xuan --demo --screenshot /tmp/xuan.png
      - name: Native clipboard test
        run: xvfb-run -a env -u WAYLAND_DISPLAY cargo test --locked --bin xuan system_clipboard_images_and_files_paste_from_another_process -- --ignored --test-threads=1
      - name: Remove Debian package
        run: |
          sudo apt-get remove -y xuan
          test ! -e /usr/bin/xuan
          test ! -e /usr/share/applications/me.silverl.xuan.desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xuan-linux-x86_64
          path: dist/*
          if-no-files-found: error
  mcp-server:
    # The MCP server plugin is its own Cargo workspace (its dependencies stay
    # out of Xuan's lock file), so the main check does not build it.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: plugins/mcp-server
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Rust
        # Installs the toolchain pinned in the repository's rust-toolchain.toml.
        run: rustup toolchain install
      - name: Format
        run: cargo fmt -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
  compatibility:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: '20.04'
            native: '0'
          - ubuntu: '22.04'
            native: '1'
          - ubuntu: '24.04'
            native: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xuan-linux-x86_64
          path: dist
      - name: Test release on Ubuntu ${{ matrix.ubuntu }}
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
          XUAN_CHECK_NATIVE: ${{ matrix.native }}
        run: |
          chmod +x dist/*.AppImage
          docker run --rm \
            -v "$GITHUB_WORKSPACE/dist:/packages:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/checks:ro" \
            -e XUAN_CHECK_NATIVE \
            "ubuntu:$UBUNTU_VERSION" bash /checks/check-linux-compat.sh
