name: Windows
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# Literal prefix: inside a reusable-workflow call github.workflow is the
# caller's name, which would put Linux and Windows in one group.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # Shown in About and `xuan --version`; build.rs shortens the commit to 7 characters.
      XUAN_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      # Only the tag-triggered Release workflow (which calls this one) builds a release.
      XUAN_BUILD_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'dev' }}
      # Missing real-camera fixtures fail the RAW tests instead of skipping.
      XUAN_REQUIRE_RAW_FIXTURES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Set up Rust
        # Installs the toolchain pinned in rust-toolchain.toml.
        run: rustup toolchain install
      - name: Cache RAW test fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testdata/raw/cache
          key: raw-fixtures-${{ hashFiles('testdata/raw/fixtures.txt') }}
      - name: Fetch RAW test fixtures
        run: scripts/fetch-raw-fixtures.sh
      - name: Check and test
        run: scripts/check.sh
      - name: Upload golden-image differences
        # Written by the golden tests (src/goldens.rs) when a rendering differs.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-failures-windows
          path: target/golden-failures/
          if-no-files-found: ignore
      - name: Package
        run: python scripts/package-windows.py
      - name: Verify distribution packages
        run: python scripts/check-packages.py
      - name: Native DirectX 12 smoke test
        env:
          WGPU_BACKEND: dx12
        run: |
          python - <<'PY'
          import struct
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path

          package, = Path('dist').glob('xuan-*-windows-x86_64.zip')
          with tempfile.TemporaryDirectory(prefix='xuan smoke ') as directory:
              root = Path(directory)
              with zipfile.ZipFile(package) as archive:
                  archive.extractall(root)
              executable = root / package.stem / 'xuan.exe'
              screenshot = root / 'demo.png'
              subprocess.run(
                  [executable, '--demo', '--screenshot', screenshot],
                  check=True,
                  timeout=180,
              )
              data = screenshot.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', 'Missing or invalid screenshot'
              width, height = struct.unpack('>II', data[16:24])
              assert width >= 850 and height >= 560, (width, height)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xuan-windows-x86_64
          # The Linux job supplies the shared source archive for releases.
          path: dist/xuan-*-windows-x86_64.zip*
          if-no-files-found: error
  mcp-server:
    # The MCP server plugin is its own Cargo workspace (its dependencies stay
    # out of Xuan's lock file), so the main check does not build it.
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: plugins/mcp-server
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Rust
        # Installs the toolchain pinned in the repository's rust-toolchain.toml.
        run: rustup toolchain install
      - name: Format
        run: cargo fmt -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
