[package]
name = "xuan"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
description = "A native image compositor for Linux and Windows, built with Rust, wgpu and egui"
license = "MIT"

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6", features = ["wayland-data-control"] }
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
cosmic-text = "0.14.2"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "persistence"] }
egui = "0.33.3"
egui_extras = { version = "0.33.3", default-features = false, features = ["svg"] }
flate2 = "1.1"
heic-rs = "0.1.1"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp", "gif"] }
# Bézier paths (src/vector.rs): flattening, bounds and SVG arcs. The version usvg already uses.
kurbo = { version = "0.11.3", default-features = false, features = ["std"] }
# Reloading open projects that change on disk (src/watch.rs): inotify, ReadDirectoryChangesW and
# FSEvents. CC0-1.0. Only the FSEvents backend of the default features, so macOS does not poll.
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }
png = "0.18"
# TIFF export with its print resolution (src/io.rs). The version `image` already uses.
tiff = { version = "0.11.3", default-features = false }
# Model downloads (src/plugins/models.rs): a small blocking HTTPS client on
# rustls with ring, so no OpenSSL; certificates are checked against the
# system's trust store.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# SHA-256 of downloaded models, with ring's assembly, the same crate rustls uses.
ring = "0.17"
rawler = "=0.8.0"
rayon = "1.11"
raw-window-handle = "0.6"
rfd = "0.15.4"
# SVG import (src/io/svg.rs), and SVG window buttons through egui_extras (the version
# egui_extras already uses).
resvg = { version = "0.45", default-features = false }
# OpenRaster's stack.xml (src/io/ora.rs): the version usvg already uses, with its node limit and
# no DTDs.
roxmltree = "0.20"
semver = "1.0.28"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tempfile = "3"
toml = "0.8"
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
# Lossy WebP export (src/io.rs): libwebp, built by libwebp-sys from its bundled C
# source, so no system libwebp is needed. Lossless WebP stays with `image`.
webp = { version = "0.3.1", default-features = false }
wgpu = { version = "27.0.1", default-features = false, features = ["vulkan", "gles", "wgsl"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop portal's appearance settings (src/app/system_theme/linux.rs). Already built for
# rfd's portal dialogs; only the blocking API is added.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
calloop = "0.13"
calloop-wayland-source = "0.3"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
x11rb = { version = "0.13", features = ["xinput"] }
# Blocking the network for plugins (src/plugins/sandbox.rs). Pinned: its
# `apply_filter` runs between fork and exec and was audited for this version.
seccompiler = "=0.5.0"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "27.0.1", default-features = false, features = ["dx12"] }
windows-sys = { version = "0.61", features = ["Win32_UI_Input_Pointer", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "27.0.1", default-features = false, features = ["metal"] }
# Asking before macOS quits (src/app/macos.rs). Already built for arboard and rfd.
objc2 = "0.6"

[target.'cfg(unix)'.dependencies]
# Killing a plugin's process group.
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
pollster = "0.4"
egui_kittest = { version = "0.33.3", default-features = false }
# A local HTTPS server for the model download tests.
rcgen = { version = "0.13", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server"] }

[patch.crates-io]
# Preserve paste events when the clipboard contains an image without text.
egui-winit = { path = "vendor/egui-winit" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Test the decoder as it ships. Rawler's debug assertions fire on paths that
# release builds handle cleanly (its header-only decode of Canon sRAW trips
# one), so debug and test builds would otherwise report different errors.
[profile.dev.package.rawler]
debug-assertions = false

[profile.release]
lto = "thin"
codegen-units = 1
