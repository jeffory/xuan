[plugin]
id = "comfy-cloud"
name = "Comfy Cloud"
version = "0.2.0"
description = "Generate and edit images with Seedream and Ideogram on Comfy Cloud, using Comfy's own workflow templates and keeping them up to date."
command = ["python3", "main.py"]

[permissions]
network = ["cloud.comfy.org", "*.run.comfy.app", "storage.googleapis.com"]
secrets = ["api_key"]
document = "edit"

[[settings]]
id = "api_key"
type = "secret"
label = "API key"
help = "Create one at platform.comfy.org. Sent to the server as the Bearer token, and with each job for the Seedream and Ideogram nodes."

[[settings]]
id = "base_url"
type = "text"
label = "Server"
default = "https://cloud.comfy.org"
help = "Comfy Cloud, or a Comfy API deployment (https://<name>.run.comfy.app). Templates always come from cloud.comfy.org."

[[settings]]
id = "timeout"
type = "integer"
label = "Wait up to (seconds)"
default = 600
min = 30
max = 3600

[[actions]]
id = "generate"
label = "Generate Image…"
menu = "Plugins"
kind = "generate"
description = "Generate an image from a description with Seedream 5.0 or Ideogram 4.5."
result = { into = "ask" }

[[actions.inputs]]
id = "prompt"
type = "multiline"
label = "Prompt"
placeholder = "A lighthouse on a cliff at dusk, painted in gouache"

[[actions.inputs]]
id = "model"
type = "enum"
label = "Model"
values = [
  { id = "seedream-pro", label = "Seedream 5.0 Pro" },
  { id = "seedream-flash", label = "Seedream 5.0 Flash (faster, cheaper)" },
  { id = "ideogram", label = "Ideogram 4.5 (good with lettering)" },
]
default = "seedream-pro"

[[actions.inputs]]
id = "aspect"
type = "enum"
label = "Shape"
values = [
  { id = "1:1", label = "Square 1:1" },
  { id = "4:3", label = "Landscape 4:3" },
  { id = "3:2", label = "Landscape 3:2" },
  { id = "16:9", label = "Wide 16:9" },
  { id = "3:4", label = "Portrait 3:4" },
  { id = "2:3", label = "Portrait 2:3" },
  { id = "9:16", label = "Tall 9:16" },
]
default = "1:1"

[[actions.inputs]]
id = "resolution"
type = "enum"
label = "Size"
values = [{ id = "1K", label = "About 1 megapixel" }, { id = "2K", label = "About 4 megapixels" }]
default = "2K"

[[actions.inputs]]
id = "seed"
type = "seed"
label = "Seed"

[[actions]]
id = "edit"
label = "Edit Image…"
menu = "Filter"
kind = "edit"
description = "Describe a change and Ideogram 4.5 or Seedream 5.0 repaints the layer with it, as a new layer."
source = { from = "layer", max_side = 2048 }
result = { into = "layer" }

[[actions.inputs]]
id = "prompt"
type = "multiline"
label = "Change"
placeholder = "Make it night, with the windows lit"

[[actions.inputs]]
id = "model"
type = "enum"
label = "Model"
values = [
  { id = "ideogram-edit", label = "Ideogram 4.5" },
  { id = "seedream-pro-edit", label = "Seedream 5.0 Pro" },
]
default = "ideogram-edit"

[[actions.inputs]]
id = "seed"
type = "seed"
label = "Seed"

[[actions]]
id = "precise-edit"
label = "Precise Edit…"
menu = "Filter"
kind = "edit"
description = "Draw boxes over the parts to change, or turn the selection into one, and describe each change. Ideogram 4.5 changes only what you ask for."
source = { from = "layer", max_side = 2048, crop_to_regions = true, padding = 0.25 }
result = { into = "layer", mask_to_regions = true }

[[actions.inputs]]
id = "regions"
type = "regions"
label = "Edits"
min = 1
fields = [
  { id = "desc", type = "text", label = "Instruction", placeholder = "Add sunglasses" },
  { id = "type", type = "enum", label = "Kind", values = [{ id = "obj", label = "Object" }, { id = "text", label = "Text" }], default = "obj" },
  { id = "text", type = "text", label = "Text to write", placeholder = "Only for Text boxes" },
]

[[actions.inputs]]
id = "background"
type = "text"
label = "Background"
placeholder = "Leave empty to keep it"

[[actions.inputs]]
id = "quality"
type = "enum"
label = "Quality"
values = [
  { id = "very_low", label = "Draft" },
  { id = "low", label = "Low" },
  { id = "medium", label = "Medium" },
  { id = "high", label = "High" },
]
default = "medium"

[[actions.inputs]]
id = "seed"
type = "seed"
label = "Seed"

[[actions]]
id = "split-layers"
label = "Split into Layers…"
menu = "Layer"
kind = "edit"
description = "Seedream 5.0 separates the flattened image into a background and layers you can move, each as a new layer."
source = { from = "composite", max_side = 2048 }
result = { into = "layer" }

[[actions.inputs]]
id = "prompt"
type = "text"
label = "What to separate"
placeholder = "Leave empty to find the main elements"

[[actions.inputs]]
id = "model"
type = "enum"
label = "Model"
values = [
  { id = "split-pro", label = "Seedream 5.0 Pro" },
  { id = "split-flash", label = "Seedream 5.0 Flash (faster, cheaper)" },
]
default = "split-pro"

[[actions.inputs]]
id = "seed"
type = "seed"
label = "Seed"

[[panes]]
id = "comfy"
title = "Comfy Cloud"
refresh = "manual"
