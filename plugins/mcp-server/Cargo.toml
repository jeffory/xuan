[package]
name = "xuan-mcp-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Xuan plugin: a Model Context Protocol server so LLM clients can drive the editor"
license = "MIT"

# Its own workspace: these dependencies stay out of Xuan's Cargo.toml and lock file.
[workspace]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
getrandom = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
xuan-plugin = { path = "../../sdk/xuan-plugin" }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["io-util"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
